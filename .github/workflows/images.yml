# Publishes ghcr.io/<owner>/housetrack-{api,setup,web} for amd64 and arm64 when a version tag is pushed
# (git tag v0.2.0 && git push --tags). Other households then set IMAGE_OWNER and VERSION in .env.
name: images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env: { POSTGRES_USER: house, POSTGRES_PASSWORD: house }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U house" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run pytest -q
        working-directory: api
        env: { TEST_ADMIN_URL: "postgresql://house:house@localhost:5432/postgres" }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci && npm run build
        working-directory: web

  publish:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, context: api, target: api }
          - { name: setup, context: api, target: setup }
          - { name: web, context: web, target: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/housetrack-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
