[project]
name = "housetrack-api"
version = "0.1.0"
description = "House Track API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.8",
    "python-multipart>=0.0.32",
    "pillow>=12.3.0",
    "tzdata>=2026.4",
    "pypdf>=6.19.0",
    "pywebpush>=2.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
